# Hackathon deploy (hq ADR-0001): one box, `docker compose up -d --build` from the repo root's infra/.
# Public ingress per workspace ADR-0005: Cloudflare proxied DNS -> Caddy with a Cloudflare Origin CA cert.
services:
  server:
    build: { context: .., dockerfile: apps/server/Dockerfile }
    env_file: .env
    environment:
      PORT: "3000"
      DATABASE_URL: /data/adrop.sqlite
      BASE_URL: https://api.${DOMAIN}
    volumes: [ "server-data:/data" ]
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: apps/demo-web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: https://api.${DOMAIN}
        NEXT_PUBLIC_HOST_ATA: ${HOST_ATA}
        NEXT_PUBLIC_RPC_URL: ${PUBLIC_RPC_URL:-https://api.devnet.solana.com}
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: [ "80:80", "443:443" ]
    environment: { DOMAIN: ${DOMAIN} }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
    depends_on: [ server, web ]
    restart: unless-stopped
volumes:
  server-data:
  caddy-data:
