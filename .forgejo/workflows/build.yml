# Push to main: build server, web and docs images with kaniko (no Docker socket on the runner,
# operator ADR-0008), push to the Forgejo registry, bump the tags in adrop/deploy so Argo CD
# rolls them out (hq ADR-0004). Registry push uses the CI bot (hq scripts/ci-registry-bot.sh).
name: build
on:
  push:
    branches: [main]
env:
  REGISTRY: git.janbo.internal
  CA: /etc/ssl/certs/ca-certificates.crt
jobs:
  # One image per job: kaniko unpacks the base image over the container's filesystem and clones
  # into /kaniko/buildcontext, so a second executor run in the same container fails ("repository already exists").
  images:
    runs-on: docker
    strategy:
      matrix:
        include:
          - { image: server, dockerfile: apps/server/Dockerfile, args: "" }
          - { image: docs, dockerfile: infra/docs.Dockerfile, args: "" }
          - { image: web, dockerfile: apps/demo-web/Dockerfile, args: "--build-arg NEXT_PUBLIC_API_BASE=https://api.adrop.sh --build-arg NEXT_PUBLIC_HOST_ATA=GYs2Ucn7MDE27VBiN4PU2MHZfVmM24ivD2FaJVX7RoyE" }
    container:
      image: gcr.io/kaniko-project/executor:v1.23.2-debug
    defaults: { run: { shell: sh } }
    steps:
      - name: Registry credentials of the CI bot
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          [ -n "$REGISTRY_USER" ] && [ -n "$REGISTRY_TOKEN" ] || { echo "REGISTRY_USER/REGISTRY_TOKEN unset (hq scripts/ci-registry-bot.sh)"; exit 1; }
          mkdir -p /kaniko/.docker
          auth=$(printf '%s:%s' "$REGISTRY_USER" "$REGISTRY_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY" "$auth" > /kaniko/.docker/config.json
      - name: Build and push
        env:
          GIT_USERNAME: ${{ github.actor }}
          GIT_PASSWORD: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_ARGS: ${{ matrix.args }}
        run: |
          /kaniko/executor --context "git://$REGISTRY/$GITHUB_REPOSITORY.git#refs/heads/main#$GITHUB_SHA" \
            --dockerfile "$DOCKERFILE" $BUILD_ARGS \
            --destination "$REGISTRY/adrop/$IMAGE:$GITHUB_SHA" --destination "$REGISTRY/adrop/$IMAGE:main" \
            --registry-certificate "$REGISTRY=$CA" --snapshot-mode=redo --cache=false
  deploy:
    needs: images
    runs-on: docker
    steps:
      - name: Bump the tags in adrop/deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "[git.janbo.internal]:2222 ssh-rsa " > ~/.ssh/known_hosts
          git clone -q --depth 1 ssh://git@git.janbo.internal:2222/adrop/deploy.git /tmp/deploy
          cd /tmp/deploy
          for img in server web docs; do
            awk -v img="git.janbo.internal/adrop/$img" -v tag="$GITHUB_SHA" '
              $0 ~ "name: " img "$" { print; getline; sub(/newTag: .*/, "newTag: " tag) } { print }
            ' overlays/dev/kustomization.yaml > /tmp/k.yaml && mv /tmp/k.yaml overlays/dev/kustomization.yaml
          done
          git -c user.name=ci -c user.email=ci@adrop.janbo.internal commit -qam "ci: images $GITHUB_SHA" || { echo "no change"; exit 0; }
          git push -q origin HEAD:main
